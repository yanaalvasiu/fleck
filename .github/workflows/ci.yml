# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.x', cache: true}
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with: {version: v2.15.0}
      - name: Dependency license compatibility
        run: |
          test -z "$(go list -m -json all | grep -E 'GPL|AGPL|LGPL' || true)"

  windows-build:
    name: Windows build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.x', cache: true}
      - name: Cross-build Windows binary
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o "dist/fleck-${{ matrix.goarch }}.exe" ./cmd/bin
