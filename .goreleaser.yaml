# SPDX-License-Identifier: GPL-3.0-or-later
version: 2
builds:
  - id: bin
    main: ./cmd/bin
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    CGO_ENABLED: "0"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  github:
    owner: yanaalvasiu
    name: fleck
